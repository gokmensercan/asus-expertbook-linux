PACKAGE_NAME="asus-expertbook-asus-wmi"
PACKAGE_VERSION="1.0.0"
AUTOINSTALL="yes"
# Source trees are bundled per kernel series (see Makefile); other series are
# skipped rather than built from a mismatching copy.
BUILD_EXCLUSIVE_KERNEL="^(7\.2\.|6\.18\.)"

BUILT_MODULE_NAME[0]="asus-wmi"
DEST_MODULE_LOCATION[0]="/updates"
BUILT_MODULE_NAME[1]="asus-nb-wmi"
DEST_MODULE_LOCATION[1]="/updates"

# CachyOS kernels use Clang/ThinLTO. LLVM=1 is also safe for Arch kernels and
# avoids silently producing an incompatible object for CachyOS.
MAKE[0]="make -C /lib/modules/${kernelver}/build M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build KERNELRELEASE=${kernelver} modules LLVM=1"
